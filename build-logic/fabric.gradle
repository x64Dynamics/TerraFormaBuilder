apply plugin: (targetMinecraft.startsWith('26.') ? 'net.fabricmc.fabric-loom' : 'fabric-loom')
dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    if (!targetMinecraft.startsWith('26.')) {
        mappings loom.officialMojangMappings()
    }
    if (targetMinecraft.startsWith('26.')) {
        implementation "net.fabricmc:fabric-loader:${targetPins.getProperty('fabric.version')}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${targetPins.getProperty('fabric.version')}"
    }
}
loom {
    runs {
        client {
            client()
            runDir(new File(templateRunRoot,"${targetMinecraft}/fabric/client").absolutePath)
            vmArgs "-Dorg.lwjgl.opengl.Display.preferDedicatedGpu=true", "-Dsun.java2d.opengl=true", "-Dminecraft.preferDedicatedGpu=true"
        }
        server {
            server()
            runDir(new File(templateRunRoot,"${targetMinecraft}/fabric/server").absolutePath)
        }
    }
}
