def metadata = new Properties()
new File(templateRoot, 'properties/mod.properties').withReader('UTF-8') { metadata.load(it) }
ext.modMetadata = metadata
def configuredRunRoot = project.findProperty('runRoot')?.toString() ?: 'run'
ext.templateRunRoot = new File(configuredRunRoot).isAbsolute() ? new File(configuredRunRoot) : new File(templateRoot, configuredRunRoot)
group = metadata.getProperty('mod.group')
version = metadata.getProperty('mod.version')
buildDir = new File(templateRoot, targetLoader == 'core' ? 'build/core' : "build/${targetMinecraft}/${targetLoader}")
base.archivesName = "${metadata.getProperty('mod.id')}-${targetMinecraft}-${targetLoader}"

repositories { mavenCentral() }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetLoader == 'core' ? 21 : targetPins.getProperty('java.release').toInteger())
    sourceCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
    targetCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
}
sourceSets {
    main {
        java.setSrcDirs(['common/src/main/java', "versions/${targetMinecraft}/common/src/main/java", "versions/${targetMinecraft}/${targetLoader}/src/main/java"].collect { new File(templateRoot,it) })
        resources.setSrcDirs(['common/src/main/resources', "versions/${targetMinecraft}/common/src/main/resources", "versions/${targetMinecraft}/${targetLoader}/src/main/resources"].collect { new File(templateRoot,it) })
    }
    test {
        java.setSrcDirs([new File(templateRoot,'common/src/test/java')])
        resources.setSrcDirs([new File(templateRoot,'common/src/test/resources')])
    }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
        systemProperty 'terminal.jline', 'false'
    }
    if (name == 'runClient') {
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', new File(templateRunRoot,"${targetMinecraft}/${targetLoader}/client/natives").absolutePath
        systemProperty 'org.lwjgl.opengl.Display.preferDedicatedGpu', 'true'
        systemProperty 'sun.java2d.opengl', 'true'
        systemProperty 'minecraft.preferDedicatedGpu', 'true'
        if (project.findProperty('smokeTest') != 'true') {
            minHeapSize = '1024m'
            maxHeapSize = '3072m'
            jvmArgs '-XX:+UnlockExperimentalVMOptions', '-XX:+UseG1GC', '-XX:G1NewSizePercent=20', '-XX:G1ReservePercent=20', '-XX:MaxGCPauseMillis=50'
        }
    }
    if (project.findProperty('smokeTest') == 'true' && name in ['runClient','runServer']) {
        maxHeapSize = '1536m'
        jvmArgs '-XX:ActiveProcessorCount=2'
    }
}
processResources {
    exclude '**/.gitkeep'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def values = [mod_id: metadata.getProperty('mod.id'), mod_name: metadata.getProperty('mod.name'), mod_version: version.toString(), mod_description: metadata.getProperty('mod.description'), mod_license: metadata.getProperty('mod.license'), minecraft_version: targetMinecraft, java_release: targetPins.getProperty('java.release'), loader_version: targetPins.getProperty("${targetLoader}.version", '')]
    inputs.properties(values)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand(values) }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(new File(templateRoot,'LICENSE'))
    manifest { attributes('Implementation-Version': project.version) }
}
test { maxParallelForks = 2 }

tasks.register('verifySourceLayout') {
    group = 'verification'
    description = 'Checks the effective shared, version, and loader compilation inputs.'
    doLast {
        def javaRoots = targetLoader == 'core' ? [new File(templateRoot,'common/src/main/java')] : ['common/src/main/java', "versions/${targetMinecraft}/common/src/main/java", "versions/${targetMinecraft}/${targetLoader}/src/main/java"].collect { new File(templateRoot,it) }
        def resourceRoots = targetLoader == 'core' ? [new File(templateRoot,'common/src/main/resources')] : ['common/src/main/resources', "versions/${targetMinecraft}/common/src/main/resources", "versions/${targetMinecraft}/${targetLoader}/src/main/resources"].collect { new File(templateRoot,it) }
        def actualRoots = sourceSets.main.java.srcDirs.collect { it.canonicalFile }
        def actualResources = sourceSets.main.resources.srcDirs.collect { it.canonicalFile }
        assert javaRoots.every { actualRoots.contains(it.canonicalFile) } : 'A configured Java source root is missing'
        assert resourceRoots.every { actualResources.contains(it.canonicalFile) } : 'A configured resource root is missing'
        def expectedSources = javaRoots.collectMany { fileTree(it).matching { include '**/*.java' }.files as List }.collect { it.canonicalFile }
        def compilerSources = tasks.named('compileJava',JavaCompile).get().source.files.collect { it.canonicalFile }
        assert expectedSources.every { compilerSources.contains(it) } : 'Shared or adapter Java files are missing from compileJava'
        def expectedResources = resourceRoots.collectMany { fileTree(it).matching { exclude '**/.gitkeep' }.files as List }.collect { it.canonicalFile }
        def processedResources = tasks.named('processResources').get().source.files.collect { it.canonicalFile }
        assert expectedResources.every { processedResources.contains(it) } : 'Shared or adapter resources are missing from processResources'
        def report = [minecraft:targetMinecraft, loader:targetLoader, javaRoots:actualRoots.collect { it.path }, resourceRoots:actualResources.collect { it.path }, compilerSources:compilerSources.collect { it.path }.sort(), sharedSources:fileTree(new File(templateRoot,'common/src/main/java')).matching { include '**/*.java' }.files.collect { it.canonicalPath }.sort()]
        def destination = new File(project.buildDir,'reports/source-layout.json')
        destination.parentFile.mkdirs()
        destination.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))+'\n','UTF-8')
        logger.lifecycle("Source layout verified: ${targetMinecraft}/${targetLoader}, ${compilerSources.size()} Java files")
    }
}
tasks.named('check') { dependsOn 'verifySourceLayout' }
